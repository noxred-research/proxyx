# Oxylabs Residential. Grammar (read 2026-10-15):
#   customer-{user}-cc-{CC}[-city-{city}]-sessid-{id}-sesstime-{min}
# `sessid_oneip` replaces `sessid` for a strict session (502 instead of a new IP).
# https://developers.oxylabs.io/products/proxies/residential-proxies/session-control
# Target ports are limited to 80 and 443 (answer: 403 port_not_allowed).
# https://developers.oxylabs.io/products/proxies/residential-proxies/protocols

[[adapter]]
id = "oxylabs_res"
kind = "rotating"
subtype = "residential"
scheme = "http"
host = "pr.oxylabs.io"
port = 7777
user_file = "oxylabs_res_user"
pass_file = "oxylabs_res_pass"
user = "customer-{base_user}{opts}"
pass = "{base_pass}"
allowed_ports = [80, 443]
# 10 minutes by default, 1440 at most, 60 s idle.
max_session_minutes = 1440
echo_url = "https://ip.oxylabs.io"

[[adapter.option]]
name = "country"
to = "user"
frag = "-cc-{v}"
case = "upper"

[[adapter.option]]
name = "city"
to = "user"
frag = "-city-{v}"
charset = "word"
max_len = 48

[[adapter.option]]
name = "sid"
to = "user"
frag = "-sessid-{v}"
strict_frag = "-sessid_oneip-{v}"
charset = "alnum"
len = 16

[[adapter.option]]
name = "ttl"
to = "user"
frag = "-sesstime-{v}"
unit = "min"
max = 1440
