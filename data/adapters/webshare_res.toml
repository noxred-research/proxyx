to = "user"
frag = "-{v}"
case = "lower"

[[adapter.option]]
name = "city"
to = "user"
frag = "-city_{v}"
charset = "alpha_underscore"
case = "lower"

[[adapter.option]]
name = "sid"
to = "user"
frag = "-{v}"
charset = "digits"
len = 16

