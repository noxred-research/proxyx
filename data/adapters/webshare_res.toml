# Webshare Rotating Residential. Verified 2026-11-11:
# https://apidocs.webshare.io/proxy-connection
# https://help.webshare.io/en/articles/16310718-endpoint-generator-rotating-residential
# Sticky: {user}-{cc}[-city_{city}]-{numeric_session_id}
# Per-request rotation: {user}-{cc}[-city_{city}]-rotate
# Sticky lifetime is set in the dashboard (1 minute..24 hours), not credentials.
# Set max_session_minutes to that dashboard duration before enabling this example.
# No strict/no-replacement mode is documented. Strict requests are refused.
# Per-request adapters are for direct recipes, not reusable exit-IP pool units.

[[adapter]]
id = "webshare_sticky_http"
kind = "rotating"
subtype = "residential"
scheme = "http"
host = "p.webshare.io"
port = 80
user_file = "webshare_res_user"
pass_file = "webshare_res_pass"
user = "{base_user}{opts}"
pass = "{base_pass}"
max_session_minutes = 1440
echo_url = "https://ipv4.webshare.io/"

[[adapter.option]]
name = "country"
to = "user"
frag = "-{v}"
case = "lower"

[[adapter.option]]
name = "city"
to = "user"
frag = "-city_{v}"
charset = "alpha_underscore"
case = "lower"

[[adapter.option]]
name = "sid"
to = "user"
frag = "-{v}"
charset = "digits"
len = 16

[[adapter]]
id = "webshare_sticky_socks5"
kind = "rotating"
subtype = "residential"
scheme = "socks5"
host = "p.webshare.io"
port = 1080
user_file = "webshare_res_user"
pass_file = "webshare_res_pass"
user = "{base_user}{opts}"
pass = "{base_pass}"
max_session_minutes = 1440
echo_url = "https://ipv4.webshare.io/"

[[adapter.option]]
