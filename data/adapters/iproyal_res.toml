# IPRoyal Residential: the options go in the PASSWORD. Grammar (read 2026-10-15):
#   {pass}_country-{cc}_session-{id}_lifetime-{N}m[_killswitch-1]
# The session id is exactly 8 alphanumeric characters. Lifetime: 1 second to 7 days, one
# unit only. `_killswitch-1` answers HTTP 410 instead of changing the IP.
# https://docs.iproyal.com/proxies/residential/proxy/rotation

[[adapter]]
id = "iproyal_res"
kind = "rotating"
subtype = "residential"
scheme = "http"
host = "geo.iproyal.com"
port = 12321
user_file = "iproyal_res_user"
pass_file = "iproyal_res_pass"
user = "{base_user}"
pass = "{base_pass}{opts}"
max_session_minutes = 10080

[[adapter.option]]
name = "country"
to = "pass"
frag = "_country-{v}"
case = "lower"

[[adapter.option]]
name = "sid"
to = "pass"
frag = "_session-{v}"
charset = "alnum"
len = 8

[[adapter.option]]
name = "ttl"
to = "pass"
frag = "_lifetime-{v}m"
unit = "min"
max = 10080

[[adapter.option]]
name = "strict"
to = "pass"
frag = "_killswitch-1"
