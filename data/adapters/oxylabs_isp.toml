# Oxylabs Dedicated ISP, self-service. One inventory entry per rented IP, on ports 8001-8010.
# Verified against a real account 2026-10-17: entry point `isp.oxylabs.io`, one port
# per IP (8001-8010), and the username is sent as is, with NO `user-` prefix (the docs
# linked below show `disp.oxylabs.io` and a `user-` prefix; the account does not).
# https://developers.oxylabs.io/products/proxies/dedicated-isp-proxies/self-service/making-requests
#
# The port is not set here: each inventory entry carries its own port, and the IP, not
# the port, is the key (Oxylabs may change the port-to-IP map).
# `user_file` and `pass_file` name files in the secrets directory. No value lives here.
#
# `echo_url` returns the exit IP as plain text and no country: it is one IP vote of the
# exit check. The exit country comes from the public services of the check (Cloudflare
# `cdn-cgi/trace` `loc=`, ipinfo, ifconfig.co); see `proxyx_pool::exit_ip`.

[[adapter]]
id = "oxylabs_isp"
kind = "static"
subtype = "isp"
scheme = "http"
host = "isp.oxylabs.io"
user_file = "oxylabs_isp_user"
pass_file = "oxylabs_isp_pass"
user = "{base_user}"
pass = "{base_pass}"
# Fair usage: 100 concurrent sessions per IP until 100 GB a month, then 10.
max_conns_per_ip = 100
echo_url = "https://ip.oxylabs.io"
