# Pages the light probe and the browser prober load through a candidate.
# Targets of a region are: global, then its country, then its city, each URL
# once. `global` is the baseline every region gets; each served country adds
# its own search-engine site, so an IP is also tried against the site its users see
# (not every country has a `<cc>` domain: gb has a `co.uk` one, jp a `co.jp` one).
# Format: docs/providers.md. Only http(s) URLs.
#
# The prober's browsers reach the internet through the gateway's probe
# listener, which opens only the hosts of these pages plus `extra_hosts` (and
# their subdomains), on ports 80 and 443: a probe token that leaks from a
# browser process is not an open proxy. `extra_hosts` are the hosts a
# page needs that are not its own: the search engine sends EU visitors to a
# consent host and serves the page's assets from a static-content host. Any other
# host is refused (`destination_denied`), so a page whose load needs a new host
# fails until it is listed here.

global = ["https://www.google.com/"] # detection-data
extra_hosts = ["google.com", "gstatic.com"] # detection-data

[region]
us = ["https://www.google.com/"] # detection-data
gb = ["https://www.google.co.uk/"] # detection-data
de = ["https://www.google.de/"] # detection-data
fr = ["https://www.google.fr/"] # detection-data
nl = ["https://www.google.nl/"] # detection-data
es = ["https://www.google.es/"] # detection-data
it = ["https://www.google.it/"] # detection-data
ca = ["https://www.google.ca/"] # detection-data
au = ["https://www.google.com.au/"] # detection-data
jp = ["https://www.google.co.jp/"] # detection-data
br = ["https://www.google.com.br/"] # detection-data
in = ["https://www.google.co.in/"] # detection-data
