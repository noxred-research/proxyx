# Dependency update pull requests, one weekly batch per ecosystem.
#
# Updates are grouped so a week produces a handful of pull requests rather than dozens, and a
# 7-day cooldown keeps brand-new releases out of the proposals. Security updates are not
# delayed by the cooldown, and Dependabot security updates are enabled in the repository settings.
#
# Dependabot pull requests never pass CI: their actor and author are the bot, and the `authorize`
# job in every workflow only admits code owners (see .github/CODEOWNERS), so every other job is
# skipped and the required `required` check does not succeed on them. A maintainer handles them as follows:
#   1. Read the diff. For the github-actions ecosystem this includes the new commit SHA, which
#      must also be added to the repository's allowed-actions list or every run fails to start.
#   2. Bring the update onto a branch of your own (merge or cherry-pick it, adapt the code to
#      any breaking change, keep Cargo.lock in step; for the prober regenerate
#      prober/requirements-test.txt with the command in its header) and open a pull request from
#      that branch. Its CI runs under your identity.
#   3. Merge that pull request once it is green, then close the Dependabot one if it stays open.
#
# The `fuzz/` workspace has its own manifest and is not a member of the root workspace, so it is
# listed separately.

version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      fuzz-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /prober
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(pip)"
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"
    groups:
      compose-images:
        patterns: ["*"]
