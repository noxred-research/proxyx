name: security

# Supply-chain checks:
#   - advisories and secret-history run after main-branch pushes, weekly and on dispatch.
#     Unlike CI's working-tree scan, gitleaks checks every fetched branch and tag's full
#     history. No baseline hides historical findings; rotate any exposed credential.
#   - dependency-review runs on pull requests and fails when the change adds a dependency with
#     a known vulnerability of high severity or worse.
#   - scorecard runs the OpenSSF Scorecard on the default branch, uploads the result to code
#     scanning and publishes it to the Scorecard API.
# dependency-review and scorecard need the public dependency graph and code scanning, so they
# only run once the repository is public.
#
# Every job needs authorize, which reads user owners of the default branch's CODEOWNERS
# `*` rule through the API, never through the checkout under test. Both the actor and
# rerun actor must be owners; pull requests also need an owner author and a same-repository
# head. GitHub's recorded schedule actor must remain an owner; main-branch pushes authorize
# the pusher, not the authors of merged commits. This gate does not replace fork-workflow
# restrictions and required code-owner review in repository settings: a pull request can
# change its own workflow file.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 2" # weekly (Tuesday)
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event.pull_request.number || github.event.schedule || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - name: Only code owners' events run workflows
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          deny() {
            echo "::notice title=workflow gate::not run: $1"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$EVENT_NAME" in
            push|pull_request|schedule|workflow_dispatch) ;;
            *) deny "event ${EVENT_NAME} is not allowed" ;;
          esac
          # Resolve ownership from the trusted default branch, not the event checkout.
          branch="${DEFAULT_BRANCH:-$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)}"
          case "$EVENT_NAME" in
            push) [ "$GITHUB_REF" = refs/heads/main ] || deny "push is not on main" ;;
            schedule) [ "$GITHUB_REF" = "refs/heads/$branch" ] || deny "schedule is not on the default branch" ;;
          esac
          codeowners=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/CODEOWNERS?ref=${branch}" --jq .content | base64 -d)
          # The last global rule wins. Team owners cannot be resolved with this token.
          owners=$(printf '%s\n' "$codeowners" | awk '
            $1 == "*" {
              o = ""
              for (i = 2; i <= NF; i++) {
                if ($i ~ /^#/) break
                if ($i ~ /^@[A-Za-z0-9-]+$/) o = o tolower(substr($i, 2)) "\n"
              }
            }
            END { printf "%s", o }')
          [ -n "$owners" ] || deny "no user owner for the * rule in CODEOWNERS on ${branch}"
          is_owner() {
            [ -n "$1" ] && printf '%s\n' "$owners" | grep -qxF -- "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')"
          }
          is_owner "$ACTOR" || deny "actor is not a code owner"
          is_owner "$TRIGGERING_ACTOR" || deny "triggering actor is not a code owner"
          if [ "$EVENT_NAME" = pull_request ]; then
            is_owner "$PR_AUTHOR" || deny "pull request author is not a code owner"
            [ "$PR_HEAD_REPO" = "$GITHUB_REPOSITORY" ] || deny "pull request comes from a fork"
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: authorize
    if: needs.authorize.outputs.ok == 'true' && github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-deny@0.20.2
      - name: Check locked dependencies against current advisories
        run: cargo deny --locked check advisories

  secret-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: authorize
    if: needs.authorize.outputs.ok == 'true' && github.event_name != 'pull_request'
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (pinned release, sha256-verified)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 5 --retry-delay 5 -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan all fetched history without exposing secret values
        run: gitleaks git --log-opts="--all" --config .gitleaks.toml --redact

  workflow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: authorize
    if: needs.authorize.outputs.ok == 'true' && github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.32.0"
          inputs: .github
          advanced-security: false
          annotations: true

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: authorize
    if: needs.authorize.outputs.ok == 'true' && github.event_name == 'pull_request' && github.event.repository.private == false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: authorize
    if: needs.authorize.outputs.ok == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    permissions:
      contents: read
      actions: read
      security-events: write # upload the SARIF result to code scanning
      id-token: write # sign the published result
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
