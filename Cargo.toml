[workspace]
resolver = "2"
members = [
    # Shared
    "crates/pool-common",
    "crates/session-common",
    # Pool gateway: policy, providers, dialing, state, verification, warming, data plane, control API
    "crates/policy",
    "crates/provider",
    "crates/dial",
    "crates/db",
    "crates/store",
    "crates/verify",
    "crates/warmer",
    "crates/gateway",
    "crates/pool-api",
    "crates/pool",
    # Integrator client
    "crates/client",
    # MCP server: AI agents monitor, manage and configure ProxyX
    "crates/mcp",
    # Session proxy: interception data plane, control plane, GraphQL schema
    "crates/intercept",
    "crates/control",
    "crates/control-graphql",
    "crates/control-schema",
    # Self-hosted multi-IP proxy server (no database)
    "crates/edge",
    # Rate-limit service
    "crates/limiter-proto",
    "crates/limiter-core",
    "crates/limiter-server",
    "crates/limiter-bench",
    # Microbenchmarks and the load tool
    "crates/bench",
    # Operations: self-check framework (light, shared with the session proxy) and the
    # `proxyx doctor` / `proxyx assess` commands
    "crates/diag",
    "crates/ops",
    # The binary
    "crates/proxyx",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/noxred-research/proxyx"
homepage = "https://proxyx.dev"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
# Runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "time"] }

# Logging and telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.34"
opentelemetry = { version = "0.33", features = ["trace"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic"] }
sentry = { version = "0.35", default-features = false, features = [
    "anyhow",
    "backtrace",
    "contexts",
    "panic",
    "tracing",
    "reqwest",
    "rustls",
] }
sentry-tracing = "0.49"
prometheus = { version = "0.13", default-features = false }
pprof = { version = "0.14", features = ["prost-codec"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
toml = "0.8"
prost = "0.13"
prost-build = "0.13"

# Config and CLI
figment = { version = "0.10", features = ["env", "toml"] }
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"

# HTTP
axum = "0.8"
http = "1"
httparse = "1"
h2 = "0.4"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tower-service = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
async-graphql = { version = "7", features = ["uuid"] }
async-graphql-axum = "7"

# TLS and crypto
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
boring = "5"
tokio-boring = "5"
tokio-rustls = "0.26"
rcgen = { version = "0.13", features = ["x509-parser"] }
x509-parser = "0.18"
rustls-pki-types = { version = "1.12", features = ["std"] }
rustls-native-certs = "0.8"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
# PKCS#1 v1.5 signing of CDN download URLs (signing only; 0.10 is constant time).
rsa = { version = "0.10", features = ["pkcs1v15"] }

# Storage
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "mysql",
    "mysql-rsa",
    "sqlite",
    "time",
    "uuid",
    "json",
    "macros",
    "migrate",
] }
clickhouse = { version = "0.15", features = ["time", "uuid"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
lapin = { version = "4", default-features = false, features = ["tokio", "rustls", "rustls--aws_lc_rs", "rustls-native-certs"] }
futures-util = "0.3"
rskafka = { version = "0.6", features = ["transport-tls"] }
rdkafka = { version = "0.39", features = ["ssl", "tokio", "zstd"] }

# Object storage (traffic view exports)
aws-config = { version = "1", features = ["behavior-version-latest"] }
# `default-features = false` drops the legacy hyper 0.14 / rustls 0.21 client the `rustls` feature adds.
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-credential-types = "1"
azure_core = "1"
azure_identity = "1"
azure_storage_blob = "1"
azure_storage_sas = "1"

# Utilities
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
bytes = "1"
dashmap = "6"
moka = { version = "0.12", features = ["future", "sync"] }
parking_lot = "0.12"
time = { version = "0.3", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["now"] }
base64 = "0.23"
flate2 = "1"
brotli = "9"
regex = "1"
regex-syntax = "0.8"
ipnet = "2"
pwhash = "1"
argon2 = "0.5"
hickory-resolver = "0.26"
subtle = "2"
rand = "0.8"
libc = "0.2"
nix = { version = "0.31", default-features = false, features = ["net", "socket"] }
socket2 = { version = "0.6", features = ["all"] }
tikv-jemallocator = "0.7"

# Benchmarks
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
hdrhistogram = { version = "7", default-features = false }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
