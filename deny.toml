[graph]
all-features = true

[licenses]
# CDLA-Permissive-2.0: webpki-roots (Mozilla root store data), permissive.
allow = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "OpenSSL", "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Workspace crates are `publish = false`; AGPL-3.0-only is the project license.
private = { ignore = true }

[advisories]
yanked = "deny"
unmaintained = "workspace"
# Each ignore names why the advisory does not apply and when to revisit it.
ignore = [
  # rsa: Marvin timing side channel on PKCS#1 v1.5 decryption. ProxyX only signs CDN URLs with
  # an operator key (no decryption oracle), and sqlx-mysql uses it for the caching_sha2 password
  # exchange that ProxyX runs over TLS. No fixed release of the 0.9 line exists yet.
  { id = "RUSTSEC-2023-0071", reason = "no decryption oracle; revisit when rsa 0.10 is stable" },
  # libsqlite3-sys: the bundled SQLite misreads a crafted database plus a WAL file of another
  # page size. The fix needs libsqlite3-sys 0.39, which sqlx 0.8/0.9 do not allow yet. ProxyX
  # opens only operator-owned database files in a private directory.
  { id = "RUSTSEC-2026-0459", reason = "needs local write access to the database directory; revisit with the next sqlx release" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
