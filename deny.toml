[graph]
all-features = true

[licenses]
# CDLA-Permissive-2.0: webpki-roots (Mozilla root store data), permissive.
allow = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "OpenSSL", "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Workspace crates are `publish = false`; AGPL-3.0-only is the project license.
private = { ignore = true }

[advisories]
yanked = "deny"
unmaintained = "workspace"
# Each ignore names why the advisory does not apply and when to revisit it.
ignore = [
  # libsqlite3-sys: the bundled SQLite misreads a crafted database plus a WAL file of another
  # page size. SQLx 0.9 now resolves libsqlite3-sys 0.37, but the fix needs 0.39,
  # outside its supported range (<0.38). ProxyX opens only operator-owned files.
  { id = "RUSTSEC-2026-0459", reason = "needs local write access to the database directory; revisit with the next sqlx release" },
]
# RUSTSEC-2026-0543 (chrono, unmaintained, no vulnerability) is deliberately NOT ignored. No
# ProxyX crate depends on `chrono` directly any more: `rskafka` 0.6.0 pulls it in and re-exports it
# for its record timestamp, and `unmaintained = "workspace"` only reports direct workspace
# dependencies, so `cargo deny` passes (an ignore entry would only warn `advisory-not-detected`).
# Scanners that read `Cargo.lock` (OpenSSF Scorecard, OSV) still report it. Upstream issue:
# https://github.com/influxdata/rskafka/issues/311.
# REVIEW BY 2026-12-31: bump rskafka once a release drops chrono. If a ProxyX crate ever depends on
# chrono directly again, add the ignore here with a reason and the same expiry.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
