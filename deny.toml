[graph]
all-features = true

[licenses]
# CDLA-Permissive-2.0: webpki-roots (Mozilla root store data), permissive.
allow = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "OpenSSL", "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Workspace crates are `publish = false`; AGPL-3.0-only is the project license.
private = { ignore = true }

[advisories]
yanked = "deny"
unmaintained = "workspace"
# An ignore names why the advisory does not apply and when to revisit it. There is none now.
ignore = []
# RUSTSEC-2026-0543 (chrono, unmaintained, no vulnerability) is not ignored and not present:
# `rskafka` 0.6.0, the newest release, depends on `chrono`, so the workspace patches it with
# `vendor/rskafka`, a copy that takes `std::time::SystemTime` instead. `Cargo.lock` has no
# `chrono`. Upstream issue: https://github.com/influxdata/rskafka/issues/311. Drop the patch
# once a release without `chrono` exists.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
