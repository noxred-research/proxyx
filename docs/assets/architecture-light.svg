<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-label="ProxyX architecture: clients, pool gateway, session proxy with TLS interception and capture, state stores, upstream providers and platform services"><title>ProxyX architecture</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0f172a}.h{font-size:15px;font-weight:700}.b{font-size:13.5px;font-weight:600}.s{font-size:11.5px;fill:#64748b}</style><rect width="1120" height="600" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
