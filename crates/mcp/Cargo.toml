[package]
name = "proxyx-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Model Context Protocol server for ProxyX: monitor, manage and dynamically configure the proxy from AI agents"

[lints]
workspace = true

[[bin]]
name = "proxyx-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
common = { path = "../pool-common", package = "proxyx-pool-common" }
policy = { path = "../policy", package = "proxyx-policy" }
proxyx-client = { path = "../client" }
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
